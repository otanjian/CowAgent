$def with (v)
<footer class="footer">
  <div class="footer-container">
    <div class="footer-brand">
      <img src="$(v.asset(v.brand['logo_dark']))" alt="$(v.brand['name'])" class="footer-logo logo-img--dark" />
      <img src="$(v.asset(v.brand['logo_light']))" alt="" aria-hidden="true" class="footer-logo logo-img--light" />
    </div>
    <div class="footer-bottom"><p>© $(v.year()) $(v.brand['name']) · $(v.t('footer.copyright'))</p></div>
  </div>
</footer>
<script src="$(v.asset('assets/js/main.js'))"></script>
</body>
</html>
