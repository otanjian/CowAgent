function button(label,action,kind='',extra=''){return `<button type="button" class="btn ${kind}" data-action="${action}" ${extra}>${label}</button>`}
function field(label,name,value='',options={}){const {type='text',placeholder='',required=false,full=false,hint='',choices=null,secret=false,rows=false}=options;
 let control=choices?`<select id="f-${name}" name="${name}">${choices.map(([v,l])=>`<option value="${v}" ${String(value)===v?'selected':''}>${l}</option>`).join('')}</select>`:rows?`<textarea id="f-${name}" name="${name}" placeholder="${esc(placeholder)}" spellcheck="false" ${required?'required':''}>${esc(value)}</textarea>`:`<input id="f-${name}" name="${name}" type="${secret?'password':type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${required?'required':''} ${type==='number'?'min="1" max="65535"':''} autocomplete="off" ${secret?'data-secret="true"':''}>`;
 if(secret)control=`<div class="secret-wrap">${control}<button class="icon-btn" type="button" data-action="reveal" data-target="f-${name}" aria-label="显示或隐藏${label}">${icon('eye')}</button></div>`;

 ${section('OpenAPI 认证','shield')}<p class="muted small" style="margin:-5px 0 16px">使用泛微 E10 OpenAPI 能力时填写应用认证信息。</p><div class="form-grid">${field('tenantKey','tenant_key',x.tenant_key,{placeholder:'可选，登录时自动识别'})}${field('customPageConfigId','custom_page_config_id',x.custom_page_config_id,{placeholder:'可选，登录时自动识别'})}${field('App Key','app_key',x.app_key,{placeholder:'E10 OpenAPI 应用标识'})}${field('App Secret','app_secret','',{secret:true,placeholder:x.hasAppSecret?'已保存，留空不修改':'请输入应用密钥'})}${field('CorpId（企业 ID）','corp_id',x.corp_id,{full:true,placeholder:'E10 企业标识'})}</div><p class="password-help">${icon('lock')} 密码与应用密钥设计为加密保存。原型中仅模拟“已保存”状态。</p>`}

 <details class="advanced"><summary>高级设置 · 邮件文件夹与附件目录</summary><div class="form-grid">${field('默认邮件文件夹','imap_mailbox',x.imap_mailbox,{full:true,placeholder:'INBOX'})}${field('允许读取的附件目录','allowed_read_dirs',x.allowed_read_dirs,{full:true,rows:true,placeholder:'每行一个目录，留空使用默认范围'})}${field('允许写入的附件目录','allowed_write_dirs',x.allowed_write_dirs,{full:true,rows:true,placeholder:'每行一个目录，留空使用默认范围'})}</div></details><p class="password-help">至少配置 IMAP 或 SMTP 中的一项。部分邮箱需先在服务商设置中开启协议并生成授权码。</p>`}
function allConnections(){const m=state.mcp.map(x=>({...x,kind:'mcp'})),e=state.erp.map(x=>({...x,kind:'erp'}));return [...m.slice(0,1),...e.slice(0,1),...(state.oa.saved?[{...state.oa,kind:'oa',id:'oa',scope:'tenant'}]:[]),...(state.email.saved?[{...state.email,kind:'email',id:'email',scope:'personal'}]:[]),...m.slice(1),...e.slice(1)]}
function getConnection(kind,id){return kind==='mcp'||kind==='erp'?state[kind].find(x=>x.id===id):state[kind]}
function editable(kind,x){return kind==='email'||role==='platform'||(role==='tenant'&&x?.scope!=='global')}
function addressOf(x){return x.kind==='mcp'?(x.url||`${x.command||''} ${(x.args||'').split('\n').slice(0,2).join(' ')}`):x.kind==='erp'?(x.ashost||x.base_url||'内置演示数据'):x.kind==='oa'?x.base_url:x.imap_user||x.smtp_user||'尚未设置账号'}
function protocolOf(x){return x.kind==='mcp'?({stdio:'stdio · 本地命令',sse:'SSE','streamable-http':'Streamable HTTP'}[x.type]):x.kind==='erp'?(x.system==='sap'?`SAP · ${x.provider==='rfc'?'RFC / BAPI':'ADT SQL'}`:x.system==='u9'?'用友 U9 · 演示':'金蝶云星空 · 演示'):x.kind==='oa'?'泛微 OA / E10':` ${x.imap_host?'IMAP':''}${x.imap_host&&x.smtp_host?' + ':''}${x.smtp_host?'SMTP':''}`}
function scopeLabel(x){return x.kind==='email'?'仅本人':x.scope==='global'?'平台共享':x.inheritedId?'租户覆盖':'当前租户'}
function render(){
 $('#breadcrumb-title').textContent=view==='overview'?'控制台概览':'外部系统接入';

 $('#main').innerHTML=`<div class="page-head"><div><h1>外部系统接入</h1><p>连接企业系统与个人服务，拓展智能体的工作能力。</p></div><div class="head-actions">${button(icon('file')+'设计说明','design','ghost')}${button(icon('plus')+'新增连接','add','primary')}</div></div>
 <div class="catalog-bar"><div class="catalog-tabs" role="tablist" aria-label="连接类型筛选">${[['all','全部连接'],...Object.entries(tabMeta).map(([k,v])=>[k,v.name])].map(([k,n])=>`<button id="tab-${k}" class="catalog-tab ${k===tab?'active':''}" role="tab" aria-selected="${k===tab}" aria-controls="connection-catalog" data-tab="${k}">${n}<span class="number">${k==='all'?all.length:all.filter(x=>x.kind===k).length}</span></button>`).join('')}</div><div class="catalog-tools"><label class="search-box">${icon('search')}<input id="connection-search" aria-label="搜索连接" placeholder="搜索连接名称、地址…" value="${esc(search)}"></label><select id="connection-filter" class="filter" aria-label="筛选连接状态"><option value="all">全部状态</option>${[['ok','连接正常'],['error','连接异常'],['idle','待测试'],['disabled','已停用'],['demo','演示模式']].map(([v,n])=>`<option value="${v}" ${filter===v?'selected':''}>${n}</option>`).join('')}</select></div></div>
 <section id="connection-catalog" role="tabpanel" aria-labelledby="tab-${tab}"><div class="catalog-summary" id="catalog-summary"></div><div class="cards" id="connection-cards"></div><div class="empty" id="empty-state" hidden></div></section>

function renderCards(){if(view!=='integrations')return;const all=allConnections();const items=all.filter(x=>(tab==='all'||x.kind===tab)&&`${x.name} ${addressOf(x)} ${protocolOf(x)}`.toLowerCase().includes(search.toLowerCase())&&(filter==='all'||(filter==='disabled'?x.enabled===false:((x.enabled!==false)&&x.status===filter))));

 $('#catalog-summary').innerHTML=`<span>共 ${items.length} 个连接<span class="summary-extra"><span class="dot-sep">·</span>${good} 个连接正常${bad?`<span class="dot-sep">·</span><span style="color:var(--red)">${bad} 个待处理</span>`:''}</span></span><span><span class="demo-dot"></span>示例连接</span>`;
 $('#connection-cards').innerHTML=items.map(cardHTML).join('')+(!search&&filter==='all'?`<button class="connection-card card-new" data-action="add"><span class="add-circle">${icon('plus')}</span><strong>接入一个新系统</strong><small>选择类型，完成配置即可使用</small><span class="types-line">${icon('plug')}${icon('server')}${icon('building')}${icon('mail')}</span></button>`:'');
 $('#empty-state').hidden=items.length>0||(!search&&filter==='all');$('#empty-state').innerHTML=icon('search')+`<h3>没有找到匹配的连接</h3><p>试试其他名称，或清除当前筛选条件。</p>${button('清除筛选','clear-filter')}`;

function cardHTML(x){const disabled=x.enabled===false,edit=editable(x.kind,x),m=tabMeta[x.kind];const canTest=edit||(x.kind==='mcp'&&role!=='member');const desc=x.kind==='mcp'?x.description||'通过 MCP 协议发现与调用工具':x.kind==='erp'?x.system==='sap'?'用于业务数据查询与场景同步':'仅演示连接流程，不访问真实 ERP':x.kind==='oa'?'查询待办、读取流程与处理审批':'搜索、阅读邮件与发送附件';
return `<article class="connection-card ${x.status==='error'&&!disabled?'has-error':''}" data-card="${x.kind}:${x.id}" aria-label="${esc(x.name)}连接卡片"><div class="card-main"><div class="card-top"><span class="card-type-icon ${x.kind}">${icon(m.icon)}</span><div class="card-status">${disabled?'<span class="status idle">已停用</span>':statusHTML(x)}<span class="subline">${x.status==='checking'?'正在检查连接…':esc(x.checked||'尚未测试')}</span></div></div>
 <div class="card-name"><h3>${esc(x.name||m.name)}</h3>${x.is_default?'<span class="tag accent">默认</span>':''}</div><div class="card-address mono">${esc(addressOf(x))}</div><div class="card-tags"><span class="tag">${protocolOf(x)}</span><span class="tag ${x.scope==='global'?'purple':x.kind==='email'?'accent':''}">${icon(x.kind==='email'?'user':x.scope==='global'?'globe':'building')}${scopeLabel(x)}</span></div>
 <div class="card-meta"><span>${m.name}</span>${x.kind==='mcp'&&x.tools?`<button class="text-btn" data-action="tools" data-kind="mcp" data-id="${x.id}">${x.tools} 个可用工具 ${icon('chevron')}</button>`:x.kind==='mcp'?'<span>待发现工具</span>':x.kind==='email'?'<span>收发独立配置</span>':x.kind==='oa'?'<span>单站点配置</span>':'<span>场景共享</span>'}</div><div class="card-alert">${x.status==='error'&&!disabled?'认证失败，请检查连接参数与凭据。':desc}</div></div>
 <div class="card-bottom">${x.kind==='mcp'?`<label class="switch-label"><button class="toggle" role="switch" aria-label="${esc(x.name)}：${disabled?'启用':'停用'}" aria-checked="${!disabled}" data-action="toggle" data-kind="mcp" data-id="${x.id}" ${role==='member'?'disabled':''}></button>${disabled?'已停用':'已启用'}</label>`:'<span class="spacer"></span>'}${canTest?button(icon('refresh')+'测试','test-row','',`data-kind="${x.kind}" data-id="${x.id}" ${x.status==='checking'?'disabled':''}`):''}${button(icon(edit?'sliders':'eye')+(edit?'配置':x.scope==='global'&&role==='tenant'?'租户定制':'查看'),'edit','edit',`data-kind="${x.kind}" data-id="${x.id}"`)}<button class="icon-btn" data-action="details" data-kind="${x.kind}" data-id="${x.id}" aria-label="${esc(x.name)}更多操作">${icon('more')}</button></div></article>`}
function showModal(title,sub,body,foot='',wide=false){const d=$('#modal');modalReturnFocus=document.activeElement;d.classList.toggle('design-dialog',wide);d.innerHTML=`<div class="dialog-shell"><div class="dialog-head"><div><h2 id="modal-title">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="icon-btn" data-action="close-modal" aria-label="关闭弹窗">${icon('close')}</button></div><div class="dialog-content">${body}</div>${foot?`<div class="dialog-foot">${foot}</div>`:''}</div>`;if(!d.open)d.showModal()}

async function testEditor(){const c=editorContext;if(!c||c.readOnly)return;const form=$('#editor-form'),data=collect(form);if(!validate(form,c.kind,data,c.original))return;const mode=$('#simulation-mode').value,gen=++testGeneration;c.generation=gen;c.result=null;$('#editor-result').innerHTML=testResultHTML(c.kind,{checking:true});const b=$('[data-action="test-editor"]');b.disabled=true;b.innerHTML=icon('refresh','spin')+'测试中';$('#editor-result').scrollIntoView({block:'nearest',behavior:'smooth'});await new Promise(r=>setTimeout(r,1050));if(!editorContext||editorContext!==c||c.generation!==gen)return;c.result=simulatedResult(c.kind,mode,data);$('#editor-result').innerHTML=testResultHTML(c.kind,c.result);b.disabled=false;b.innerHTML=icon('refresh')+'重新测试';if(c.kind==='oa'&&c.result.success){if(!form.elements.tenant_key.value)form.elements.tenant_key.value='demo-tenant-001';if(!form.elements.custom_page_config_id.value)form.elements.custom_page_config_id.value='demo-login-page';c.dirty=true;$('#editor-save-state').textContent='有未保存的修改'}$('#editor-result').scrollIntoView({block:'nearest',behavior:'smooth'})}

function details(kind,id){const x=getConnection(kind,id);if(!x)return;const full={...x,kind},can=editable(kind,x),override=kind==='mcp'&&x.scope==='global'&&role==='tenant';let actions=button('关闭','close-modal');if(kind==='erp'&&!x.is_default&&x.system==='sap'&&can)actions+=button(icon('star')+'设为默认','default','',`data-kind="erp" data-id="${id}"`);if(x.inheritedId&&can)actions+=button('恢复平台默认','restore','',`data-kind="mcp" data-id="${id}"`);else if(can&&(kind==='erp'||kind==='mcp'))actions+=button(icon('trash')+'删除连接','delete','danger',`data-kind="${kind}" data-id="${id}"`);actions+=button(can?'编辑配置':override?'为本租户定制':'查看配置','edit','primary',`data-kind="${kind}" data-id="${id}"`);
showModal('连接详情',x.name,`<div class="test-detail-heading"><span class="card-type-icon ${kind}">${icon(tabMeta[kind].icon)}</span><span>${statusHTML(x)}<p>${esc(x.checked||'尚未测试')}</p></span></div>${[['连接名称',x.name],['接入类型',protocolOf(full)],['使用范围',scopeLabel(full)],['连接地址',addressOf(full)],['配置说明',x.description||'—']].map(([k,v])=>`<div class="detail-line"><label>${k}</label><span>${esc(v)}</span></div>`).join('')}${kind==='mcp'&&x.tools?`<div style="margin-top:17px">${button(icon('bolt')+`查看 ${x.tools} 个工具`,'tools','',`data-kind="mcp" data-id="${id}"`)}</div>`:''}${kind==='oa'||kind==='email'?'<p style="margin-top:15px">该类型采用单一配置。通过编辑更新账号与连接参数。</p>':''}${override?'<div class="note" style="margin-top:17px">'+icon('globe')+'平台连接由平台管理员维护。你可以创建本租户覆盖，不影响其他租户。</div>':''}`,actions)}
function showTools(id){const x=getConnection('mcp',id);const generic=[['search','搜索知识与业务内容','只读'],['fetch','获取指定资源的完整内容','只读'],['list_resources','列出当前可访问的资源','只读'],['get_metadata','读取资源属性与更新时间','只读'],['read_document','读取文档正文与结构','只读'],['list_collections','查询知识集合','只读'],['write_file','写入授权目录的文件','写入'],['create_directory','在授权目录下创建目录','写入']];const file=[['read_file','读取授权目录中的文件','只读'],['list_directory','列出目录内的文件','只读'],['search_files','按名称搜索文件','只读'],['get_file_info','查询文件元数据','只读'],['read_multiple_files','批量读取文件','只读'],['list_allowed_directories','列出已授权目录','只读'],['write_file','写入授权目录的文件','写入'],['create_directory','在授权目录下创建目录','写入']];const list=(x.type==='stdio'?file:generic).slice(0,x.tools||0);showModal('可用工具',`${esc(x.name)} · ${list.length} 个示例工具`,`<div class="note">${icon('info')}工具发现不等于调用授权。请在「工具与技能」中授予所需能力。</div>${list.map(([n,d,r])=>`<div class="tool-item"><span class="tag ${r==='写入'?'amber':''}">${r}</span><strong class="mono">${n}</strong><p>${d}</p></div>`).join('')}`,button('完成','close-modal','primary'))}
function toggleConnection(id){const x=getConnection('mcp',id);if(role==='member'||!x)return;if(x.scope==='global'&&role==='tenant'){const original=clone(x);x.baseGlobal=original;x.inheritedId=x.id;x.scope='tenant'}x.enabled=!x.enabled;renderCards();toast(x.enabled?'服务已启用（模拟）':'服务已停用，智能体不再加载该服务工具（模拟）')}
function setDefault(id){const x=getConnection('erp',id);if(!x||!editable('erp',x)||x.system!=='sap')return;state.erp.forEach(e=>e.is_default=e.id===id);closeModal();renderCards();toast(`已将「${x.name}」设为默认连接（模拟）`)}
function deleteConnection(kind,id){const x=getConnection(kind,id);if(!x||!editable(kind,x))return;confirmAction('删除这条连接？',`将移除「${x.name}」的配置。引用该连接的智能体或场景将无法继续使用它。${x.is_default?'删除后不会自动指定其他默认连接。':''}`,'删除连接',()=>{state[kind]=state[kind].filter(e=>e.id!==id);render();toast('连接已删除（模拟）')})}
function restoreConnection(id){const x=getConnection('mcp',id);if(!x?.baseGlobal)return;confirmAction('恢复平台默认配置？','将清除当前租户的覆盖配置，重新使用平台共享的连接。','恢复默认',()=>{state.mcp[state.mcp.findIndex(e=>e.id===id)]=clone(x.baseGlobal);render();toast('已恢复平台默认连接（模拟）')})}
function showGuide(){showModal('外部系统接入指南','从选择类型到智能体使用，完成三步配置。',`<ol class="steps"><li><strong>选择系统类型</strong>MCP 服务与 ERP 支持多条连接；OA 为租户单一站点，邮箱为当前用户单一账号。</li><li><strong>填写参数并测试</strong>根据类型填写服务地址、协议和认证信息。测试通过后保存；测试失败可查看原因并修改。</li><li><strong>授权并使用</strong>MCP 工具交由「工具与技能」授权；ERP 场景选择连接或使用默认连接；OA 与邮箱由对应技能读取配置。</li></ol><h3>准备哪些信息？</h3><div class="detail-line"><label>MCP</label><span>远程 URL 或本地启动命令、参数、环境变量；必要的认证信息。</span></div><div class="detail-line"><label>ERP</label><span>SAP 主机 / 服务地址、Client、账号密码，以及 RFC 或 ADT 连接方式。</span></div><div class="detail-line"><label>OA</label><span>泛微站点、登录账号密码；E10 OpenAPI 需要应用认证信息。</span></div><div class="detail-line"><label>邮箱</label><span>IMAP / SMTP 服务器、端口、邮箱账号和授权码。至少启用一项协议。</span></div><div class="note" style="margin-top:20px">${icon('info')}本 Demo 不建立真实连接。你可以在配置页面底部切换“连接成功、认证失败、连接超时”等模拟测试场景。</div>`,button('开始接入','add','primary'))}
function showDesign(){showModal('外部系统接入 · 设计方案','沿用当前控制台框架，统一入口，按类型提供专属配置体验。',`<div class="design-intro"><span class="card-type-icon mcp">${icon('plug')}</span><p><b style="color:var(--text)">菜单位置</b><br>模型与接入 → 模型服务 → 消息渠道 → <b style="color:var(--accent)">外部系统接入</b></p></div><h3>交互结构</h3><p>主页面统一展示连接卡片，类型与状态可筛选。点击「新增连接」先选择类型，再进入对应配置抽屉。卡片直接提供测试、配置与状态反馈；更多操作包含详情、删除、默认连接及恢复平台默认。</p><h3 class="spec-title">对齐 OneAgent 的能力</h3><table class="spec-table"><thead><tr><th>类型</th><th>配置与操作</th><th>使用范围</th></tr></thead><tbody><tr><td>MCP</td><td>stdio / SSE / Streamable HTTP；命令、参数、环境变量、URL；新增、编辑、删除、启停、测试与工具发现；平台共享、租户覆盖及恢复默认。</td><td>平台 / 租户</td></tr><tr><td>ERP</td><td>SAP RFC / BAPI 与 ADT SQL；连接管理、认证、测试、唯一默认连接、场景复用。U9 / 金蝶保留演示模式标识。</td><td>当前租户</td></tr><tr><td>OA</td><td>泛微站点与登录；tenantKey、customPageConfigId、App Key、App Secret、CorpId；保存与登录测试；对接 OA 技能。</td><td>每租户一个站点</td></tr><tr><td>邮箱</td><td>IMAP / SMTP、端口、TLS / SSL、证书校验、账号授权码、发件人、文件夹、附件目录；分别测试收发协议；对接邮件技能。</td><td>每用户独立配置</td></tr></tbody></table><h3 class="spec-title">前后端落地方案</h3><p>新增独立页面模块，连接卡片只展示名称、范围、状态等摘要；各类型表单独立维护。复用现有身份、租户、授权和加密存储能力，避免把个人参数编辑器当作连接管理器。</p><table class="spec-table"><thead><tr><th>接口 / 模块</th><th>实现安排</th></tr></thead><tbody><tr><td><code>/api/mcp</code><br>GET / POST / PUT</td><td>新增配置与测试 API，兼容现有 MCP 运行时。POST 区分平台与租户配置；测试返回工具目录。</td></tr><tr><td><code>/api/erp/connections</code><br><code>/api/erp/connections/options</code><br><code>/api/procurement/erp-sync</code></td><td>复用已迁入接口与 SAP 适配器，补前端入口。保留当前项目租户隔离；完善秘密字段加密、脱敏与留空保留。</td></tr><tr><td><code>/api/oa/connection</code><br><code>/api/oa/connection/test</code></td><td>迁入配置、加密、登录测试与运行时凭据注入，适配当前租户权限体系。</td></tr><tr><td><code>/api/email/config</code><br><code>/api/email/config/test</code></td><td>迁入个人邮箱配置、分协议测试与邮件技能；用户身份只从登录会话确定。</td></tr></tbody></table><h3 class="spec-title">权限与凭据</h3><p>平台管理员维护共享 MCP；租户管理员维护租户连接及平台 MCP 的租户覆盖；普通成员查看已授权连接、维护自己的邮箱。密码不回显，留空保留；更换账号需重新录入凭据。保存与测试的后端必须独立校验权限。</p><h3 class="spec-title">原型验收范围</h3><p>可演示连接卡片、按类型新增与编辑、字段联动与校验、测试成功 / 失败 / 超时、MCP 工具发现与启停、ERP 唯一默认、删除确认、平台覆盖恢复、个人邮箱与租户权限区分。右上角可切换三种演示身份及明暗主题。</p><div class="note" style="margin-top:20px">${icon('info')}此文件是可离线打开的交互原型。数据仅存于当前页面内存，刷新恢复示例；不调用真实接口，不发送邮件，不保存输入的密码或密钥。正式实现仍需接入后端并进行真实系统联调。</div>`,button('了解了','close-modal','primary'),true)}
function renderOverview(){const cards=[['bot','智能体管理','创建、配置和管理智能体'],['bolt','工具与技能','配置工具与技能，扩展智能体能力'],['brain','记忆管理','管理知识与长期记忆'],['sliders','模型服务','管理大语言模型与模型参数'],['radio','消息渠道','接入多类消息入口'],['plug','外部系统接入','连接 MCP、ERP、OA 与个人邮箱'],['users','成员管理','添加与管理当前租户成员'],['network','组织架构','维护部门与人员关系']];$('#main').innerHTML=`<div class="page-head"><div><h1>控制台概览</h1><p>管理智能体、系统接入与组织资源。</p></div><span class="tag">导航位置预览</span></div><div class="overview-grid">${cards.map(([i,n,d])=>`<button class="overview-link ${i==='plug'?'feature':''}" ${i==='plug'?'data-nav="integrations"':`data-other="${n}"`}><span class="category-icon">${icon(i)}</span><span><h3>${n}${i==='plug'?'<span class="tag accent">新增</span>':''}</h3><p>${d}</p></span></button>`).join('')}</div><div class="note">${icon('info')}点击左侧「消息渠道」下方的「外部系统接入」，或点击上方新增卡片，进入本次交互原型。</div>`}
document.addEventListener('click',e=>{
 const other=e.target.closest('[data-other]');if(other){toast(`「${other.dataset.other}」沿用现有功能，本次原型聚焦外部系统接入。`);return}
 const nav=e.target.closest('[data-nav]');if(nav){view=nav.dataset.nav;render();return}
 const typeTab=e.target.closest('[data-tab]');if(typeTab){tab=typeTab.dataset.tab;render();$(`#tab-${tab}`)?.focus();return}
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,kind=b.dataset.kind,id=b.dataset.id;
 if(a==='add'){closeModal();chooseType()}
 else if(a==='choose-type'){const existing=(kind==='oa'||kind==='email')&&state[kind].saved;openEditor(kind,existing?kind:null)}
 else if(a==='edit')openEditor(kind,id);
 else if(a==='close-modal')closeModal();
 else if(a==='close-editor')closeEditor();
 else if(a==='save-editor')saveEditor();
 else if(a==='test-editor')testEditor();
 else if(a==='test-row')testRow(kind,id);
 else if(a==='details')details(kind,id);
 else if(a==='tools')showTools(id);
 else if(a==='toggle')toggleConnection(id);
 else if(a==='default')setDefault(id);
 else if(a==='delete')deleteConnection(kind,id);
 else if(a==='restore')restoreConnection(id);
 else if(a==='guide')showGuide();
 else if(a==='design')showDesign();
 else if(a==='reveal'){const x=$('#'+b.dataset.target);x.type=x.type==='password'?'text':'password';b.setAttribute('aria-pressed',String(x.type==='text'))}
 else if(a==='clear-filter'){search='';filter='all';render()}
 else if(a==='confirm'){const fn=pendingAction;pendingAction=null;closeModal();fn?.()}
 else if(a==='reset')confirmAction('恢复初始演示数据？','当前页面内的新增连接和配置修改将被清除。','重置演示',()=>{state=clone(seed);tab='all';search='';filter='all';render();toast('已恢复初始示例')});
});
document.addEventListener('input',e=>{if(e.target.id==='connection-search'){search=e.target.value;renderCards()}if(e.target.closest('#editor-form')&&e.target.id!=='simulation-mode')markDirty()});
document.addEventListener('change',e=>{if(e.target.id==='connection-filter'){filter=e.target.value;renderCards()}if(e.target.closest('#editor-form')&&['type','system','provider'].includes(e.target.name)){syncConditionalFields();markDirty()}if(e.target.id==='role-select'){role=e.target.value;render();toast('演示身份已切换；邮箱始终只属于当前用户。')}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='editor-form')saveEditor()});
document.addEventListener('keydown',e=>{const t=e.target.closest('[role="tab"]');if(!t||!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;const tabs=$$('[role="tab"]');let index=tabs.indexOf(t);index=e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;e.preventDefault();tabs[index].click()});

render();
