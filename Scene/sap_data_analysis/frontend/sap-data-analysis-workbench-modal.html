<div id="sap-data-analysis-workbench-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm">
        <div class="bg-white dark:bg-[#1A1A1A] rounded-2xl border border-slate-200 dark:border-white/10 shadow-2xl w-[95vw] h-[90vh] max-w-6xl flex flex-col overflow-hidden">
            <!-- Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-white/10">
                <div class="flex items-center gap-3">
                    <div id="sap-analysis-wb-icon" class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:#06b6d4">
                        <i class="fas fa-magnifying-glass-chart text-white text-lg"></i>
                    </div>
                    <div>
                        <h3 id="sap-analysis-wb-title" class="text-lg font-bold text-slate-800 dark:text-slate-100">SAP 数据分析工作台</h3>
                        <p id="sap-analysis-wb-subtitle" class="text-xs text-slate-500 dark:text-slate-400">选择 SAP 连接，用自然语言提问，自动抽取数据并分析</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" onclick="toggleWorkbenchMaximize(this)" title="最大化 / 还原" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-white/10 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                        <i class="fas fa-expand"></i>
                    </button>
                    <button onclick="closeSapDataAnalysisWorkbench()" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-white/10 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Body -->
            <div class="flex-1 overflow-hidden p-6">
                <div class="flex flex-row gap-6 h-full">
                    <!-- Left: Parameters -->
                    <div class="w-[360px] flex-shrink-0 flex flex-col gap-5 overflow-y-auto pr-2">
                        <!-- Domain chips -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2.5">分析领域</label>
                            <div id="sap-analysis-domains" class="flex flex-wrap gap-2">
                                <button type="button" data-domain="sales" class="sap-domain-chip px-3 py-1.5 rounded-full text-xs font-medium border border-slate-200 dark:border-slate-600 bg-white dark:bg-white/5 text-slate-600 dark:text-slate-300 hover:border-cyan-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">销售</button>
                                <button type="button" data-domain="procurement" class="sap-domain-chip px-3 py-1.5 rounded-full text-xs font-medium border border-slate-200 dark:border-slate-600 bg-white dark:bg-white/5 text-slate-600 dark:text-slate-300 hover:border-cyan-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">采购</button>
                                <button type="button" data-domain="inventory" class="sap-domain-chip px-3 py-1.5 rounded-full text-xs font-medium border border-slate-200 dark:border-slate-600 bg-white dark:bg-white/5 text-slate-600 dark:text-slate-300 hover:border-cyan-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">库存</button>
                                <button type="button" data-domain="production" class="sap-domain-chip px-3 py-1.5 rounded-full text-xs font-medium border border-slate-200 dark:border-slate-600 bg-white dark:bg-white/5 text-slate-600 dark:text-slate-300 hover:border-cyan-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">生产</button>
                                <button type="button" data-domain="finance" class="sap-domain-chip px-3 py-1.5 rounded-full text-xs font-medium border border-slate-200 dark:border-slate-600 bg-white dark:bg-white/5 text-slate-600 dark:text-slate-300 hover:border-cyan-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">财务</button>
                                <button type="button" data-domain="master_data" class="sap-domain-chip px-3 py-1.5 rounded-full text-xs font-medium border border-slate-200 dark:border-slate-600 bg-white dark:bg-white/5 text-slate-600 dark:text-slate-300 hover:border-cyan-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">主数据</button>
                            </div>
                        </div>

                        <!-- Intent selector -->
                        <div id="sap-analysis-intent-section" class="hidden">
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">常见意图</label>
                            <select id="sap-analysis-intent" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-white/5 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:border-cyan-500 transition-colors">
                                <option value="">选择意图或直接在下方输入问题</option>
                            </select>
                        </div>

                        <!-- Question -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">自然语言问题 <span class="text-red-500">*</span></label>
                            <textarea id="sap-analysis-question" rows="3" placeholder="例如：这个月新增了多少家客户" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-white/5 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/10 transition-colors resize-none"></textarea>
                        </div>

                        <!-- Connection card (默认存在默认 SAP 连接时隐藏，无默认连接时显示) -->
                        <div id="sap-analysis-connection-card" class="rounded-2xl border border-slate-200 dark:border-white/10 bg-slate-50/50 dark:bg-white/5 p-4 space-y-3 hidden">
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">SAP 连接 <span class="text-red-500">*</span></label>
                            <select id="sap-analysis-connection" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:border-cyan-500 transition-colors">
                                <option value="">加载中...</option>
                            </select>
                        </div>

                        <!-- Scope params card -->
                        <div class="rounded-2xl border border-slate-200 dark:border-white/10 bg-slate-50/50 dark:bg-white/5 p-4 space-y-4">
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">范围参数</label>

                            <div>
                                <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1.5">公司代码</label>
                                <input id="sap-analysis-company-code" type="text" placeholder="1000" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:border-cyan-500 transition-colors">
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1.5">开始日期</label>
                                    <input id="sap-analysis-date-from" type="date" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:border-cyan-500 transition-colors">
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1.5">结束日期</label>
                                    <input id="sap-analysis-date-to" type="date" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:border-cyan-500 transition-colors">
                                </div>
                            </div>

                            <!-- Date quick buttons -->
                            <div class="flex flex-wrap gap-2">
                                <button type="button" data-period="this_month" class="sap-date-quick-btn px-2.5 py-1 rounded-lg text-xs border border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 text-slate-600 dark:text-slate-300 hover:border-cyan-400 hover:text-cyan-600 transition-colors">本月</button>
                                <button type="button" data-period="this_quarter" class="sap-date-quick-btn px-2.5 py-1 rounded-lg text-xs border border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 text-slate-600 dark:text-slate-300 hover:border-cyan-400 hover:text-cyan-600 transition-colors">本季</button>
                                <button type="button" data-period="this_year" class="sap-date-quick-btn px-2.5 py-1 rounded-lg text-xs border border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 text-slate-600 dark:text-slate-300 hover:border-cyan-400 hover:text-cyan-600 transition-colors">本年</button>
                                <button type="button" data-period="last_year" class="sap-date-quick-btn px-2.5 py-1 rounded-lg text-xs border border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 text-slate-600 dark:text-slate-300 hover:border-cyan-400 hover:text-cyan-600 transition-colors">去年</button>
                                <button type="button" data-period="q1" class="sap-date-quick-btn px-2.5 py-1 rounded-lg text-xs border border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 text-slate-600 dark:text-slate-300 hover:border-cyan-400 hover:text-cyan-600 transition-colors">Q1</button>
                                <button type="button" data-period="q2" class="sap-date-quick-btn px-2.5 py-1 rounded-lg text-xs border border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 text-slate-600 dark:text-slate-300 hover:border-cyan-400 hover:text-cyan-600 transition-colors">Q2</button>
                                <button type="button" data-period="q3" class="sap-date-quick-btn px-2.5 py-1 rounded-lg text-xs border border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 text-slate-600 dark:text-slate-300 hover:border-cyan-400 hover:text-cyan-600 transition-colors">Q3</button>
                                <button type="button" data-period="q4" class="sap-date-quick-btn px-2.5 py-1 rounded-lg text-xs border border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 text-slate-600 dark:text-slate-300 hover:border-cyan-400 hover:text-cyan-600 transition-colors">Q4</button>
                            </div>

                            <div>
                                <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1.5">最大行数</label>
                                <input id="sap-analysis-max-rows" type="number" value="5000" min="1" max="10000" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:border-cyan-500 transition-colors">
                                <p class="mt-1.5 text-xs text-slate-400 dark:text-slate-500">至少填写一项范围参数：公司代码、日期范围或最大行数</p>
                            </div>
                        </div>

                        <!-- Output mode -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">输出形式</label>
                            <div class="flex gap-2 p-1 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-white/5">
                                <button type="button" data-mode="table" class="sap-output-mode-btn flex-1 py-1.5 rounded-lg text-xs font-medium bg-white dark:bg-slate-600 text-cyan-600 dark:text-cyan-400 shadow-sm transition-colors">表格</button>
                                <button type="button" data-mode="chart" class="sap-output-mode-btn flex-1 py-1.5 rounded-lg text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">图表</button>
                                <button type="button" data-mode="dashboard" class="sap-output-mode-btn flex-1 py-1.5 rounded-lg text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">看板</button>
                            </div>
                        </div>

                        <!-- Action -->
                        <div class="flex gap-3 pt-1">
                            <button id="sap-analysis-plan-btn" onclick="generateSapAnalysisPlan()" class="flex-1 px-4 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-600 text-white text-sm font-medium cursor-pointer transition-colors duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
                                <i class="fas fa-wand-magic-sparkles mr-1.5"></i>生成计划
                            </button>
                            <button id="sap-analysis-execute-btn" onclick="executeSapAnalysisPlan()" class="hidden flex-1 px-4 py-2.5 rounded-xl bg-green-500 hover:bg-green-600 text-white text-sm font-medium cursor-pointer transition-colors duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
                                <i class="fas fa-bolt mr-1.5"></i>执行分析
                            </button>
                        </div>
                    </div>

                    <!-- Right: Results -->
                    <div class="flex-1 flex flex-col gap-5 overflow-y-auto min-w-0">
                        <!-- Error -->
                        <div id="sap-analysis-error" class="hidden rounded-2xl border border-red-200 dark:border-red-900/30 bg-red-50 dark:bg-red-900/10 p-4 text-sm text-red-600 dark:text-red-400"></div>

                        <!-- Empty state -->
                        <div id="sap-analysis-empty-state" class="flex-1 flex flex-col items-center justify-center text-center p-8 rounded-2xl border border-dashed border-slate-200 dark:border-white/10 bg-slate-50/30 dark:bg-white/5">
                            <div class="w-16 h-16 rounded-2xl bg-cyan-50 dark:bg-cyan-900/20 flex items-center justify-center mb-4">
                                <i class="fas fa-magnifying-glass-chart text-cyan-500 text-2xl"></i>
                            </div>
                            <h4 class="text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1">配置分析参数</h4>
                            <p class="text-xs text-slate-500 dark:text-slate-400 max-w-xs">选择领域或输入自然语言问题，点击“生成计划”开始 SAP 数据分析。</p>
                        </div>

                        <!-- Query Plan preview -->
                        <div id="sap-analysis-plan-section" class="hidden rounded-2xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/5 p-4 space-y-3">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2 text-sm font-medium text-slate-800 dark:text-slate-100">
                                    <i class="fas fa-list-check text-cyan-500"></i>
                                    <span>查询计划预览（可编辑）</span>
                                </div>
                                <button type="button" onclick="document.getElementById('sap-analysis-plan-json').classList.toggle('hidden'); this.querySelector('i').classList.toggle('fa-chevron-up'); this.querySelector('i').classList.toggle('fa-chevron-down');" class="text-xs text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200">
                                    <i class="fas fa-chevron-up mr-1"></i>折叠
                                </button>
                            </div>
                            <textarea id="sap-analysis-plan-json" rows="10" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 text-xs font-mono text-slate-800 dark:text-slate-100 focus:outline-none focus:border-cyan-500 transition-colors resize-y"></textarea>
                            <p class="text-xs text-slate-500 dark:text-slate-400">可修改表名、字段、WHERE 条件等，确认后点击左侧“执行分析”。</p>
                        </div>

                        <!-- Result preview -->
                        <div id="sap-analysis-result" class="hidden rounded-2xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/5 p-4 space-y-3">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2 text-sm font-medium text-slate-800 dark:text-slate-100">
                                    <i class="fas fa-check-circle text-green-500"></i>
                                    <span id="sap-analysis-summary"></span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <a id="sap-analysis-download" href="#" target="_blank" class="text-xs text-cyan-600 hover:text-cyan-700 dark:text-cyan-400 dark:hover:text-cyan-300 font-medium px-2 py-1 rounded-lg hover:bg-cyan-50 dark:hover:bg-cyan-900/20 transition-colors">
                                        <i class="fas fa-download mr-1"></i>CSV
                                    </a>
                                    <button onclick="sendSapAnalysisToChat()" class="text-xs bg-cyan-500 hover:bg-cyan-600 text-white px-3 py-1.5 rounded-lg transition-colors">
                                        <i class="fas fa-paper-plane mr-1"></i>发送到聊天
                                    </button>
                                </div>
                            </div>
                            <div class="text-xs text-slate-400 dark:text-slate-500 font-mono break-all" id="sap-analysis-file-path"></div>

                            <!-- Output tabs -->
                            <div class="border-b border-slate-200 dark:border-white/10">
                                <div id="sap-analysis-output-tabs" class="flex gap-4">
                                    <button type="button" data-tab="table" class="sap-output-tab pb-2 text-xs font-medium text-cyan-600 dark:text-cyan-400 border-b-2 border-cyan-500 transition-colors">数据预览</button>
                                    <button type="button" data-tab="chart" class="sap-output-tab pb-2 text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">图表</button>
                                    <button type="button" data-tab="dashboard" class="sap-output-tab pb-2 text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">看板</button>
                                </div>
                            </div>

                            <!-- Output containers -->
                            <div id="sap-analysis-output-table" class="sap-output-panel">
                                <div class="text-xs text-slate-500 dark:text-slate-400 text-center py-8">数据加载中...</div>
                            </div>
                            <div id="sap-analysis-output-chart" class="sap-output-panel hidden">
                                <div class="text-xs text-slate-500 dark:text-slate-400 text-center py-8">图表将在执行分析后生成</div>
                            </div>
                            <div id="sap-analysis-output-dashboard" class="sap-output-panel hidden">
                                <div class="text-xs text-slate-500 dark:text-slate-400 text-center py-8">看板将在执行分析后生成</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
