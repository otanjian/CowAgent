// ========== 9. SOP ==========
function renderSop() {
  var sop = getSopDone();
  // 计算到期提醒
  var now = new Date();
  var nowStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  var overdueTasks = [];
  var upcomingTasks = [];
  var todayTasks = [];
  SOP_PHASES.forEach(function(ph) {
    ph.tasks.forEach(function(t) {
      var done = state.sopCheckboxes[t.id] || false;
      if (done) return;
      var dl = '2025-' + t.deadline.replace(/-/g, '-');
      var dlDate = new Date(dl);
      var diffDays = Math.floor((dlDate - now) / 86400000);
      if (diffDays < 0) {
        overdueTasks.push({task: t, diffDays: diffDays});
      } else if (diffDays === 0) {
        todayTasks.push({task: t, diffDays: diffDays});
      } else if (diffDays <= 2) {
        upcomingTasks.push({task: t, diffDays: diffDays});
      }
    });
  });

  var html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px"><div><h1 style="font-size:22px;font-weight:700;color:var(--text-primary);margin:0">投标SOP</h1><div style="color:var(--text-secondary);font-size:13px;margin-top:4px">全流程' + sop.total + '项工作事项追踪</div></div><button onclick="downloadWithTimestamp()" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px"><svg class="icon icon-sm"><use href="#icon-save"/></svg> 保存</button></div>';

  // 横向流程图 - 关键时间节点（编号+时间信息）
  var milestones = [
    { num: '1', date: '07-02', label: '投标启动', sub: '文件获取研读', color: '#3b82f6' },
    { num: '2', date: '07-06', label: '澄清截止', sub: '如有疑问提出', color: '#f59e0b' },
    { num: '3', date: '07-11', label: '技术方案截止', sub: '暗标方案定稿', color: '#8b5cf6' },
    { num: '4', date: '07-13', label: '文件终审', sub: '全量交叉审核', color: '#f97316' },
    { num: '5', date: '07-15', label: '上传投标文件', sub: 'CA签名加密', color: '#ef4444' },
    { num: '6', date: '07-16 13:30', label: '开标截止', sub: '在线解密', color: '#dc2626' }
  ];
  html += '<div class="card mb-16"><div class="card-body" style="padding:20px 16px;overflow-x:auto">';
  html += '<div style="display:flex;align-items:flex-start;position:relative;min-width:700px;padding:0 10px">';
  // 横向连接线（贯穿编号圆圈中心）
  html += '<div style="position:absolute;top:22px;left:45px;right:45px;height:4px;background:var(--border);border-radius:99px;z-index:0"></div>';
  milestones.forEach(function(m, mi) {
    var msDate = new Date('2025-' + m.date.replace(/-/g, '-').replace(/ (\d+:\d+)$/, 'T$1'));
    var msDiff = Math.floor((msDate - now) / 86400000);
    var statusHtml = '';
    if (msDiff < 0) statusHtml = '<div style="font-size:10px;color:#ef4444;font-weight:600;margin-top:2px">已过</div>';
    else if (msDiff === 0) statusHtml = '<div style="font-size:10px;color:#f59e0b;font-weight:600;margin-top:2px">今天</div>';
    else if (msDiff <= 3) statusHtml = '<div style="font-size:10px;color:#2563eb;font-weight:600;margin-top:2px">剩'+msDiff+'天</div>';

    html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1">';
    // 编号圆圈
    html += '<div style="width:44px;height:44px;border-radius:50%;background:' + m.color + ';border:4px solid var(--bg-card);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px ' + m.color + '40">';
    html += '<span style="font-size:16px;font-weight:800;color:#fff">' + m.num + '</span>';
    html += '</div>';
    // 下方信息
    html += '<div style="margin-top:10px;text-align:center">';
    html += '<div style="font-size:14px;font-weight:700;color:' + m.color + '">' + escHtml(m.label) + '</div>';
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:2px">' + escHtml(m.date) + '</div>';
    html += '<div style="font-size:11px;color:var(--text-muted);margin-top:1px">' + escHtml(m.sub) + '</div>';
    html += statusHtml;
    html += '</div></div>';
  });
  html += '</div></div></div>';

  // 到期提醒卡片（默认收起）
  if (overdueTasks.length > 0 || todayTasks.length > 0 || upcomingTasks.length > 0) {
    var alertCount = overdueTasks.length + todayTasks.length + upcomingTasks.length;
    html += '<div class="card mb-16" style="border:2px solid var(--danger)">';
    html += '<div onclick="toggleAlert()" style="display:flex;align-items:center;gap:8px;padding:12px 20px;cursor:pointer;user-select:none">';
    html += '<svg id="alert-arrow" class="icon icon-sm chevron-arrow collapsed" style="color:var(--danger)"><use href="#icon-chevron-down"/></svg>';
    html += '<svg class="icon icon-sm" style="color:var(--danger)"><use href="#icon-alert-triangle"/></svg>';
    html += '<span style="font-weight:700;color:var(--danger);font-size:14px">待办提醒（截止 ' + nowStr + '，共 ' + alertCount + ' 项需关注）</span>';
    html += '</div>';
    html += '<div id="alert-body" style="display:none;padding:0 20px 16px 20px">';
    if (overdueTasks.length > 0) {
      html += '<div style="margin-bottom:12px"><div style="font-weight:700;color:var(--danger);font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px"><svg class="icon icon-sm" style="color:var(--danger);fill:currentColor"><use href="#icon-circle"/></svg>已逾期 ' + overdueTasks.length + ' 项（必须立即处理）</div>';
      overdueTasks.forEach(function(item) {

        if (diffDays < 0) deadlineStyle = 'color:var(--danger);font-weight:700;background:var(--danger-bg);padding:2px 8px;border-radius:99px;';
        else if (diffDays === 0) deadlineStyle = 'color:var(--warning);font-weight:700;background:var(--warning-bg);padding:2px 8px;border-radius:99px;';
        else if (diffDays <= 2) deadlineStyle = 'color:var(--accent);font-weight:600;background:var(--accent-bg);padding:2px 8px;border-radius:99px;';

      } else {
        deadlineStyle = 'color:var(--success)';
      }
      html += '<div class="sop-task' + (done ? ' completed' : '') + '" data-sop-necessity="' + t.necessity + '" data-sop-done="' + done + '" style="' + (t.priority === '高' && !done ? 'border-left:4px solid var(--danger)' : '') + '">';
      html += '<input type="checkbox" class="sop-check" data-id="' + t.id + '"' + (done ? ' checked' : '') + ' style="width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0">';
      html += '<div class="sop-task-id">' + escHtml(t.id) + '</div>';
      html += '<div class="sop-task-info">';
      html += '<div class="sop-task-name">' + escHtml(t.name) + '</div>';
      html += '<div class="sop-task-detail">' + escHtml(t.detail) + '</div>';
      html += '</div>';
      html += '<div class="sop-task-meta">';
      html += '<span class="tag ' + (isMust ? 'tag-cancel' : 'tag-warning') + '">' + escHtml(t.necessity) + '</span>';
      html += '<span style="font-size:12px;color:' + priColor + ';font-weight:600">' + escHtml(t.priority) + '</span>';
      html += '<span style="font-size:12px;' + deadlineStyle + '">' + escHtml(t.deadline) + (diffDays < 0 && !done ? ' 逾期' : (diffDays === 0 && !done ? ' 今天' : (diffDays <= 2 && !done && diffDays > 0 ? ' 剩'+diffDays+'天' : ''))) + '</span>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
  });

  return html;
}

// 阶段折叠/展开函数（全局函数，供onclick调用）
function togglePhase(idx, headerEl) {
  var tasks = document.getElementById('phase-tasks-' + idx);
  var arrow = document.getElementById('phase-arrow-' + idx);
  if (!tasks) return;
  var isHidden = tasks.style.display === 'none';
  tasks.style.display = isHidden ? '' : 'none';
  if (arrow) arrow.classList.toggle('collapsed', !isHidden);
}

// 待办提醒折叠/展开
function toggleAlert() {
  var body = document.getElementById('alert-body');
  var arrow = document.getElementById('alert-arrow');
  if (!body) return;
  var isHidden = body.style.display === 'none';
  body.style.display = isHidden ? 'block' : 'none';
  if (arrow) arrow.classList.toggle('collapsed', !isHidden);
}

// 评标策略展开/折叠函数（全局函数，供onclick调用）
function toggleStrat(el) {
  var isOpen = el.getAttribute('data-open') === '1';
  el.setAttribute('data-open', isOpen ? '0' : '1');
  var arrow = el.querySelector('.chevron-arrow');
  if (arrow) arrow.classList.toggle('collapsed', isOpen);
  el.style.color = isOpen ? 'var(--purple)' : 'var(--accent)';
  var tips = el.nextElementSibling;
  if (tips) tips.style.display = isOpen ? 'none' : 'block';
}

// ========== EVENT BINDING ==========
function bindEvents(page) {
  var content = document.getElementById('content');

  // TECH page events
  if (page === 'tech') {
    var searchInput = document.getElementById('tech-search');
    function refreshTechVisibility() {
      var q = searchInput ? searchInput.value.toLowerCase() : '';
      var filterBtn = content.querySelector('[data-tech-filter].active');
      var filter = filterBtn ? filterBtn.getAttribute('data-tech-filter') : 'all';
      content.querySelectorAll('.tech-item').forEach(function(item) {
        var imp = item.getAttribute('data-tech-importance');
        var text = item.textContent.toLowerCase();
        var matchFilter = filter === 'all' || imp === filter;
        var matchSearch = q === '' || text.indexOf(q) >= 0;
        item.style.display = matchFilter && matchSearch ? '' : 'none';
      });
      content.querySelectorAll('.tech-module').forEach(function(mod) {
        var any = false;
        mod.querySelectorAll('.tech-item').forEach(function(item) {
          if (item.style.display !== 'none') any = true;
        });
        mod.style.display = any ? '' : 'none';
      });
    }
    if (searchInput) searchInput.addEventListener('input', refreshTechVisibility);

    content.querySelectorAll('.tech-response-select').forEach(function(sel) {
      sel.addEventListener('change', function() {
        var idx = this.getAttribute('data-idx');
        state.techResponses[idx] = this.value;
        saveState();
        showToast('响应状态已更新', 'success');
      });
    });

    content.querySelectorAll('[data-tech-filter]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        content.querySelectorAll('[data-tech-filter]').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        refreshTechVisibility();
      });
    });
  }

  // DARK MARK events
  if (page === 'dark') {
    content.querySelectorAll('.dark-check').forEach(function(cb) {
      cb.addEventListener('change', function() {
        var idx = this.getAttribute('data-idx');
        state.darkMarkChecks[idx] = this.checked;
        saveState();
        renderPage('dark');
      });
    });
  }

  // RISK events
  if (page === 'risk') {
    content.querySelectorAll('.risk-status-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var idx = this.getAttribute('data-idx');
        var current = state.riskStatuses[idx] || '待处理';
        var next = current === '待处理' ? '处理中' : current === '处理中' ? '已解决' : '待处理';
        state.riskStatuses[idx] = next;
        saveState();
        renderPage('risk');
        showToast('风险状态：' + next, next === '已解决' ? 'success' : 'info');
      });
    });

    content.querySelectorAll('[data-risk-filter]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        content.querySelectorAll('[data-risk-filter]').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        var filter = this.getAttribute('data-risk-filter');
        content.querySelectorAll('.risk-card').forEach(function(card) {
          var level = card.getAttribute('data-risk-level');
          card.style.display = (filter === 'all' || level === filter) ? '' : 'none';
        });
      });
    });
  }

  // QUAL events
  if (page === 'qual') {
    content.querySelectorAll('.qual-check').forEach(function(cb) {
      cb.addEventListener('change', function() {
        var idx = this.getAttribute('data-idx');
        state.qualCheckboxes[idx] = this.checked;
        saveState();
        renderPage('qual');
      });
    });

    content.querySelectorAll('[data-qual-filter]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        content.querySelectorAll('[data-qual-filter]').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        var filter = this.getAttribute('data-qual-filter');
        content.querySelectorAll('#qual-tbody tr').forEach(function(row) {
          var nec = row.getAttribute('data-qual-necessity');
          var done = row.getAttribute('data-qual-done') === 'true';
          var show = true;
          if (filter === '必须') show = nec === '必须';
          else if (filter === '建议') show = nec === '建议';
          else if (filter === '未完成') show = !done;
          row.style.display = show ? '' : 'none';
        });
      });
    });
  }

  // SOP events
  if (page === 'sop') {
    content.querySelectorAll('.sop-check').forEach(function(cb) {
      cb.addEventListener('change', function() {
        var id = this.getAttribute('data-id');
        state.sopCheckboxes[id] = this.checked;
        dirtySop = true;
        saveState();
        // 刷新SOP页面以更新进度和到期提醒
        renderPage('sop');
      });
    });

    // 阶段折叠已改用onclick全局函数togglePhase()

    content.querySelectorAll('[data-sop-filter]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        content.querySelectorAll('[data-sop-filter]').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        var filter = this.getAttribute('data-sop-filter');
        content.querySelectorAll('.sop-task').forEach(function(task) {
          var nec = task.getAttribute('data-sop-necessity');
          var done = task.getAttribute('data-sop-done') === 'true';
          var show = true;
          if (filter === '必须') show = nec === '必须';
          else if (filter === '未完成') show = !done;
          task.style.display = show ? '' : 'none';
        });
      });
    });
  }

  // EVAL events - 策略展开已改用onclick全局函数toggleStrat()

  // PRICING events
  if (page === 'price') {
    var calcBtn = document.getElementById('calc-btn');
    if (calcBtn) {
      calcBtn.addEventListener('click', function() {
        var sw = parseFloat(document.getElementById('calc-software').value);
        var hw = parseFloat(document.getElementById('calc-hardware').value);
        var resultDiv = document.getElementById('calc-result');
        if (!sw && !hw) { showToast('请输入报价金额', 'warning'); return; }
        if (isNaN(sw) || isNaN(hw)) { showToast('请输入有效数字', 'warning'); return; }
        var total = sw + hw;
        var swLimit = parseLimitNum(PROJECT.softwareLimit);
        var hwLimit = parseLimitNum(PROJECT.hardwareLimit);
        var totalLimit = parseLimitNum(PROJECT.budget);
        var hasAnyLimit = swLimit || hwLimit || totalLimit;
        if (!hasAnyLimit) { showToast('招标文件未提供限价信息，无法校验', 'warning'); return; }
        var swOver = swLimit && sw > swLimit;
        var hwOver = hwLimit && hw > hwLimit;
        var totalOver = totalLimit && total > totalLimit;
        var swLow = swLimit && sw < swLimit * 0.85;
        var hwLow = hwLimit && hw < hwLimit * 0.85;
        var html = '<div style="padding:16px;border-radius:var(--radius);border:1px solid var(--border)">';
        html += '<div style="font-size:14px;font-weight:700;margin-bottom:12px">计算结果</div>';
        if (totalOver) {
          html += '<div class="alert alert-danger" style="margin:0 0 8px"><svg class="icon icon-sm" style="color:var(--danger)"><use href="#icon-x"/></svg> 总价 ' + total.toFixed(2) + '万元 <strong>超过限价</strong> ' + totalLimit + '万元，<strong>将被否决投标！</strong></div>';
        } else if (swOver) {
          html += '<div class="alert alert-danger" style="margin:0 0 8px"><svg class="icon icon-sm" style="color:var(--danger)"><use href="#icon-x"/></svg> 软件报价 ' + sw.toFixed(2) + '万元 <strong>超过限价</strong> ' + swLimit + '万元</div>';
        } else if (hwOver) {
          html += '<div class="alert alert-danger" style="margin:0 0 8px"><svg class="icon icon-sm" style="color:var(--danger)"><use href="#icon-x"/></svg> 硬件报价 ' + hw.toFixed(2) + '万元 <strong>超过限价</strong> ' + hwLimit + '万元</div>';
        } else {
          html += '<div class="alert alert-success" style="margin:0 0 8px"><svg class="icon icon-sm" style="color:var(--success)"><use href="#icon-check"/></svg> 报价未超限价</div>';
        }
        html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px">';
        html += '<div style="text-align:center;padding:10px;background:var(--border-light);border-radius:var(--radius)"><div style="font-size:11px;color:var(--text-secondary)">软件</div><div style="font-size:18px;font-weight:700;color:' + (swOver ? 'var(--danger)' : 'var(--accent)') + '">' + (sw||0).toFixed(2) + '万</div></div>';
        html += '<div style="text-align:center;padding:10px;background:var(--border-light);border-radius:var(--radius)"><div style="font-size:11px;color:var(--text-secondary)">硬件</div><div style="font-size:18px;font-weight:700;color:' + (hwOver ? 'var(--danger)' : 'var(--accent)') + '">' + (hw||0).toFixed(2) + '万</div></div>';
        html += '<div style="text-align:center;padding:10px;background:var(--border-light);border-radius:var(--radius)"><div style="font-size:11px;color:var(--text-secondary)">总价</div><div style="font-size:18px;font-weight:700;color:' + (totalOver ? 'var(--danger)' : 'var(--success)') + '">' + total.toFixed(2) + '万</div></div>';
        html += '</div>';
        if (totalOver || swOver || hwOver) {
          html += '<div style="font-size:12px;color:var(--danger);margin-top:8px;display:flex;align-items:center;gap:4px"><svg class="icon icon-sm" style="color:var(--danger)"><use href="#icon-alert-triangle"/></svg>请调整报价，不得超过限价！</div>';
        } else if (totalLimit) {
          var pct = Math.round(total / totalLimit * 100);
          if (pct < 85) html += '<div style="font-size:12px;color:var(--orange);margin-top:8px;display:flex;align-items:center;gap:4px"><svg class="icon icon-sm" style="color:var(--orange)"><use href="#icon-alert-triangle"/></svg>报价低于限价85%，可能被视为低价竞标</div>';
          else html += '<div style="font-size:12px;color:var(--success);margin-top:8px;display:flex;align-items:center;gap:4px"><svg class="icon icon-sm" style="color:var(--success)"><use href="#icon-check"/></svg>报价在合理区间（限价' + pct + '%）</div>';
        }
        html += '</div>';
        resultDiv.innerHTML = html;
      });
    }

    var simBtn = document.getElementById('sim-btn');
    if (simBtn) {
      simBtn.addEventListener('click', function() {
        var ourPrice = parseFloat(document.getElementById('sim-our-price').value);
        var othersStr = document.getElementById('sim-others').value;
        var resultDiv = document.getElementById('sim-result');
        if (isNaN(ourPrice) || !othersStr.trim()) { showToast('请输入完整数据', 'warning'); return; }
        var others = othersStr.split(',').map(function(s) { return parseFloat(s.trim()); }).filter(function(v) { return !isNaN(v); });
        if (others.length === 0) { showToast('请输入至少一个竞争对手报价', 'warning'); return; }
        var allPrices = [ourPrice].concat(others);
        var avg = allPrices.reduce(function(a,b){return a+b},0) / allPrices.length;
        var diff = ourPrice - avg;
        var diffPct = diff / avg * 100;
        var score;
        if (Math.abs(diffPct) < 0.01) { score = 10; }
        else if (diffPct > 0) { score = Math.max(0, 10 - diffPct * 0.3); }
        else { score = Math.max(0, 10 + diffPct * 0.2); }
        score = Math.round(score * 100) / 100;

        var html = '<div style="padding:16px;border-radius:var(--radius);border:1px solid var(--border)">';
        html += '<div style="font-size:14px;font-weight:700;margin-bottom:12px">模拟结果</div>';
        html += '<div class="info-grid" style="margin-bottom:12px">';
        html += '<div class="info-item"><span class="info-label">有效投标数</span><span class="info-value">' + allPrices.length + '家</span></div>';
        html += '<div class="info-item"><span class="info-label">基准价(均值)</span><span class="info-value">' + avg.toFixed(2) + '万元</span></div>';
        html += '<div class="info-item"><span class="info-label">我方报价</span><span class="info-value">' + ourPrice.toFixed(2) + '万元</span></div>';
        html += '<div class="info-item"><span class="info-label">偏差</span><span class="info-value" style="color:' + (diffPct > 0 ? 'var(--danger)' : diffPct < -10 ? 'var(--warning)' : 'var(--success)') + '">' + (diffPct > 0 ? '+' : '') + diffPct.toFixed(2) + '%</span></div>';
        html += '</div>';
        html += '<div style="text-align:center;padding:16px;background:' + (score >= 9 ? 'var(--success-bg)' : score >= 7 ? 'var(--warning-bg)' : 'var(--danger-bg)') + ';border-radius:var(--radius)">';
        html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">价格分得分</div>';
        html += '<div style="font-size:36px;font-weight:800;color:' + (score >= 9 ? 'var(--success)' : score >= 7 ? 'var(--warning)' : 'var(--danger)') + '">' + score + '<span style="font-size:16px">分</span></div>';
        html += '<div style="font-size:12px;color:var(--text-muted);margin-top:4px">满分10分</div>';
        html += '</div>';
        html += '<div style="font-size:11px;color:var(--text-muted);margin-top:8px">* 基准价按有效报价算术平均值模拟，实际以招标文件规则为准</div>';
        html += '</div>';
        resultDiv.innerHTML = html;
      });
    }
  }
}

// ========== INIT ==========
var currentPage = 'overview';
loadState();
if (state.currentPage) currentPage = state.currentPage;

document.getElementById('nav-menu').addEventListener('click', function(e) {
  var li = e.target.closest('li');
  if (!li) return;
  var page = li.getAttribute('data-page');
  if (page === currentPage) return;
  
  function doNavigate() {
    document.querySelectorAll('#nav-menu li').forEach(function(el) { el.classList.remove('active'); });
    li.classList.add('active');
    currentPage = page;
    state.currentPage = page;
    saveState();
    renderPage(page);
    bindEvents(page);
  }
  
  if (currentPage === 'sop' && dirtySop) {
    checkSaveBeforeLeave(doNavigate);
  } else {
    doNavigate();
  }
});

function renderPage(page) {
  var content = document.getElementById('content');
  var html = '';
  switch(page) {
    case 'overview': html = renderOverview(); break;
    case 'eval': html = renderEval(); break;
    case 'tech': html = renderTech(); break;
    case 'biz': html = renderBiz(); break;
    case 'dark': html = renderDark(); break;
    case 'risk': html = renderRisk(); break;
    case 'qual': html = renderQual(); break;
    case 'personnel': html = renderPersonnel(); break;
    case 'sop': html = renderSop(); break;
    case 'price': html = renderPrice(); break;
    default: html = '<div class="empty-state"><svg class="icon icon-lg" style="width:48px;height:48px;color:var(--text-muted)"><use href="#icon-file-text"/></svg><div class="empty-text">页面不存在</div></div>';
  }
  content.innerHTML = html;
  window.scrollTo(0, 0);
  bindEvents(page);
}

setInterval(function() {
  var el = document.getElementById('countdown');
  if (el) el.textContent = formatCountdown(PROJECT.deadline);
}, 1000);

renderPage(currentPage);
</script>
</body>
</html>
