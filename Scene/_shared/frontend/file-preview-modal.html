<div id="file-preview-modal" class="hidden fixed inset-0 z-[120] flex items-center justify-center bg-black/60 backdrop-blur-sm"
         onclick="if (event.target === this) closeFilePreview()">
        <div id="file-preview-box" class="file-preview-box bg-white dark:bg-[#1A1A1A] rounded-2xl shadow-2xl w-[92vw] h-[88vh] max-w-6xl flex flex-col overflow-hidden preview-fullscreen">
            <div class="flex items-center justify-between px-5 py-3 border-b border-slate-200 dark:border-white/10 flex-shrink-0">
                <span id="file-preview-title" class="text-sm font-semibold text-slate-700 dark:text-slate-200 truncate">预览</span>
                <div class="flex items-center gap-2">
                    <button id="file-preview-max-btn" type="button" onclick="toggleFilePreviewMaximize(this)" title="还原"
                            class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-white/10 flex items-center justify-center transition-colors">
                        <i class="fas fa-compress text-slate-400"></i>
                    </button>
                    <button onclick="closeFilePreview()"
                            class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-white/10 flex items-center justify-center transition-colors">
                        <i class="fas fa-xmark text-slate-400"></i>
                    </button>
                </div>
            </div>
            <iframe id="file-preview-iframe" class="flex-1 w-full border-0 bg-white"></iframe>
            <div id="file-preview-md" class="flex-1 overflow-y-auto hidden"></div>
        </div>
    </div>
